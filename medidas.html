<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Unidades</title>
  <!-- Apontando para medidas.css -->
  <link rel="stylesheet" href="medidas.css">
</head>
<body>
  <div class="converter-card">
    <h2>Conversor de Unidades</h2>
    
    <div class="input-group">
      <label for="category">Categoria</label>
      <select id="category">
        <option value="medidas">Medidas (Comprimento)</option>
        <option value="temperaturas">Temperaturas</option>
      </select>
    </div>

    <div class="input-group">
      <label for="inputValue">Valor</label>
      <input type="number" id="inputValue" placeholder="Digite um número" value="1">
    </div>

    <div class="conversion-row">
      <div class="input-group">
        <label for="fromUnit">De</label>
        <select id="fromUnit"></select>
      </div>

      <div class="input-group">
        <label for="toUnit">Para</label>
        <select id="toUnit"></select>
      </div>
    </div>

    <button id="convertBtn">Converter</button>

    <div class="result-box">
      <span>Resultado:</span>
      <p id="resultText">--</p>
    </div>
  </div>

  <!-- Apontando para teste.js -->
  <script src="teste.js"></script>
</body>
</html>
